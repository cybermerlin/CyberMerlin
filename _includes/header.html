<header class="page-header" role="banner">
  <h1 class="project-name"><a href="/CyberMerlin/">{{ site.title | default: site.github.repository_name }}</a></h1>
  <p>{{ site.description | default: site.github.project_tagline }}</p>
  <h2 class="project-name">{{ page.title }}</h2>
  <h3 class="project-tagline">{{ page.description }}</h3>
  {% if site.github.is_project_page %}
    <a href="{{ site.github.repository_url }}" class="btn">View on GitHub</a>
  {% endif %}
  {% if site.show_downloads %}
    <a href="{{ site.github.zip_url }}" class="btn">Download .zip</a>
    <a href="{{ site.github.tar_url }}" class="btn">Download .tar</a>
  {% endif %}

  <input style="margin-right: 5rem;" type="text" id="search-input" placeholder="Search...">
  <ul id="results-container"></ul>

  <script src="https://cdn.jsdelivr.net/npm/simple-jekyll-search@1.7.3/dest/simple-jekyll-search.min.js"></script>
  <script>
    SimpleJekyllSearch({
      searchInput: document.getElementById('search-input'),
      resultsContainer: document.getElementById('results-container'),
      json: '/CyberMerlin/search.json'
    })
  </script>

</header>
